<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="styles.css">
<link rel=""javascript" href="script.js">
<title>Responsive Navigation Experiment</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
  }

  nav {
    background: teal;
    color: teal;
    padding: 1rem;
  }

  .nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .logo {
    font-size: 1.25rem;
    font-weight: bold;
  }

  .menu-toggle {
    background: none;
    border: none;
    color: teal;
    font-size: 1.5rem;
    cursor: pointer;
    display: none;
  }

  .nav-links {
    display: flex;
    list-style: none;
    gap: 1rem;
  }

  .nav-links a {
    color: teal;
    text-decoration: none;
  }

  /* Mobile */
  @media (max-width: 768px) {
    .menu-toggle {
      display: block;
    }

    .nav-links {
      display: none;
      flex-direction: column;
      margin-top: 1rem;
      gap: 0.75rem;
    }

    .nav-links.active {
      display: flex;
    }
  }
</style>
</head>
<body>

<nav>
  <div class="nav-container">
    <div class="logo">Barbecue Crew Restaurant</div>

    <button
      class="menu-toggle"
      aria-expanded="false"
      aria-controls="navLinks">
      ☰
    </button>
  </div>

  <ul id="navLinks" class="nav-links">
    <li><a href="index.html">index.html</a></li>
    <li><a href="Sept1.html">Sept1.html</a></li>
    <li><a href="ImagesandLinks.html">ImagesandLinks.html</a></li>
    <li><a href="MerchPageGrid.html">MerchPageGrid.html</a></li>
    <li><a href="FoodSubmission.html">FoodSubmission.html</a></li>
    <li><a href="EventInformation.html">EventInformation.html</a></li>
    <li><a href="NavExperiment.html">NavExperiment.html</a></li>
  
</ul>
</nav>
<p>Welcome to the navigation experiment. This page is foremployees only. Patrons should visit the other links.</p>
</body>
