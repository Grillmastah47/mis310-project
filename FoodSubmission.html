<header>
<h1>Food Suggestion Page</h1>
<p> Got an idea for a food that everyone will love? Submit it here, and if we love it, we'll make it a reality.</p>
</header>
<main>
<form method="POST" action="https://miswebapps.uncw.edu/mis310/form-submit.aspx">
<fieldset>
          <legend>Personal Information</legend>
          <label for="full-name">Name (required):</label>
          <input type="text" id="full-name" name="name" placeholder="e.g., John Doe" required size="20">

          <label for="email">Email address (required):</label>
          <input
            placeholder="example@email.com"
            required
            id="email"
            type="email"
            name="email"
            size="20"
            </input>
          <label for="age">Age (optional):</label>
          <input type="number" name="age" id="age" min="3" max="100" </input>
        </fieldset>
        <fieldset>
            <legend>Food Suggestion</legend>
            <div><label for="food-name">Food Name (required):</label>
            <input type="text" id="food-name" name="food-name" placeholder="Dreadnought Chicken, Ultra Ribs, etc." required size="30">
            </fieldset></form</div>
            <div><label for="food-description">Food Description (required):</label>
            <textarea name="food-description" id="food-description" placeholder="Describe your food idea here..." required rows="5" cols="30"></textarea>
        </div>
        </fieldset>
        <button type="submit">Submit</button>
    </form>
</main>
